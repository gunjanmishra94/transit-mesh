version: 2

models:
  - name: mrt_performance_by_stop
    columns:
      - name: stop_id
        tests: [not_null]
      - name: avg_delay_minutes
        # Wider than the aggregate marts below: with few polls so far, a
        # single stop's average is often just one real observation (e.g. a
        # bus running genuinely ~80min early), not a smoothed average.
        # TODO: several Ruppichteroth (Rhein-Sieg) stops keep drifting more
        # negative as more polls accumulate (-252min at 138 obs -> -319min
        # at 165 obs) — growing rather than settling, so this reads as a
        # systematic bug (likely a stale reference time in a static/RT
        # schedule mismatch for that route) rather than noise. Set to a
        # generous sanity ceiling rather than re-tightened around a value
        # that keeps moving; investigate the root cause instead of chasing
        # this bound again.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -600
                max_value: 600

  - name: mrt_performance_by_municipality
    columns:
      - name: avg_delay_minutes
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -100
                max_value: 300

  - name: mrt_performance_national
    columns:
      - name: avg_delay_minutes
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -60
                max_value: 300

  - name: mrt_rt_coverage_by_agency
    columns:
      - name: agency_id
        tests: [not_null, unique]
      - name: rt_coverage_pct
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true

  - name: mrt_performance_by_mode
    columns:
      - name: route_type_label
        tests: [not_null, unique]
      - name: avg_delay_minutes
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -60
                max_value: 300

  - name: mrt_performance_by_route
    columns:
      - name: route_id
        tests: [not_null, unique]
      - name: total_observations
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 20

  - name: mrt_active_alerts
    columns:
      - name: entity_id
        tests: [not_null, unique]

  - name: mrt_alerts_by_cause
    columns:
      - name: cause
        tests: [not_null, unique]
      - name: currently_active
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
