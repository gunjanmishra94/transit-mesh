version: 2

models:
  - name: mrt_performance_by_stop
    columns:
      - name: stop_id
        tests: [not_null]
      - name: avg_delay_minutes
        # Wider than the aggregate marts below: with few polls so far, a
        # single stop's average is often just one real observation (e.g. a
        # bus running genuinely ~80min early), not a smoothed average.
        # RESOLVED: the Ruppichteroth (Rhein-Sieg) anomaly that used to
        # require a +-600min sanity ceiling here was a day-boundary/midnight-
        # rollover bug on VRS route 10930 — 141 observations at exactly
        # -1440.0min and 141 at -1439.5min (i.e. -24h, almost to the second),
        # not a real delay. Filtered at the source in
        # int_trip_delays_enriched.sql (|delay| > 12h excluded).
        # 2026-09-20: hit again, this time in the -180 to -195min band —
        # VRS route 7666 (Bonn Bad Godesberg, trips 882511/510454) and DB
        # Regio Bayern route 8062 (Scharnitz, trip 546793) each reported a
        # sustained (stable across multiple polls, not a one-off blip)
        # arrival_delay_sec straight from the upstream GTFS-RT feed of
        # roughly -2h to -3.2h. arrival_delay_sec is passed through
        # unmodified from the source feed (see stg_rt__trip_updates.sql) —
        # this isn't something our pipeline computes or can recompute, so
        # it's upstream trip-matching noise from these smaller regional
        # feeds, not a bug on our side. No clean signature like the -24h
        # case to filter at the source, so widening the floor again rather
        # than chasing each agency's noise individually.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -220
                max_value: 300

  - name: mrt_performance_by_municipality
    columns:
      - name: avg_delay_minutes
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -100
                max_value: 300

  - name: mrt_performance_national
    columns:
      - name: avg_delay_minutes
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -60
                max_value: 300

  - name: mrt_rt_coverage_by_agency
    columns:
      - name: agency_id
        tests: [not_null, unique]
      - name: rt_coverage_pct
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true

  - name: mrt_performance_by_mode
    columns:
      - name: route_type_label
        tests: [not_null, unique]
      - name: avg_delay_minutes
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -60
                max_value: 300

  - name: mrt_performance_by_route
    columns:
      - name: route_id
        tests: [not_null, unique]
      - name: total_observations
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 20

  - name: mrt_active_alerts
    columns:
      - name: entity_id
        tests: [not_null, unique]

  - name: mrt_alerts_by_cause
    columns:
      - name: cause
        tests: [not_null, unique]
      - name: currently_active
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: mrt_performance_by_agency
    columns:
      - name: agency_id
        tests: [not_null, unique]
      - name: avg_delay_minutes
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -60
                max_value: 300

  - name: mrt_map_choropleth_states
    columns:
      - name: state_name
        tests: [not_null, unique]
      - name: geojson
        tests: [not_null]

  - name: mrt_map_choropleth_districts
    columns:
      - name: district_id
        tests: [not_null, unique]
      - name: geojson
        tests: [not_null]
