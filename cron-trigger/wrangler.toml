# Cloudflare Worker that stands in for GitHub's own `schedule:` trigger,
# which is documented (and observed on this repo) to silently delay or drop
# events by hours under platform load, especially at 5-minute granularity.
# Cloudflare Cron Triggers fire reliably; this Worker turns a single 5-minute
# heartbeat into `repository_dispatch` POSTs, one per job whose interval
# (read from the CRON_STATE KV namespace, shared with the cron-orchestrator
# Pages app) is due. See src/index.js for the scheduling logic and
# ../.github/workflows/rt-ingestion.yml / static-gtfs.yml for what each
# job's event_type triggers.
#
# Jobs and their intervals live in KV, not here, so changing a job's
# frequency or turning it off never needs a redeploy of this Worker.
name = "transit-mesh-cron-trigger"
main = "src/index.js"
compatibility_date = "2026-09-20"

# Cron-only Worker, no fetch handler, so the public workers.dev route
# Cloudflare enables by default serves no purpose here.
workers_dev = false

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "CRON_STATE"
id = "d974b73097804ac081c70efa90b2979c"
