[project]
name = "transit-mesh"
version = "0.1.0"
description = "German nationwide transit intelligence platform (GTFS-RT & static pipeline)"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0",
    "dbt-duckdb>=1.8.0",
    "dagster>=1.7.0",
    "dagster-webserver>=1.7.0",
    "dagster-dbt>=0.23.0",
    "streamlit>=1.36.0",
    "pydeck>=0.9.0",
    "plotly>=5.22.0",
    "requests>=2.32.0",
    "gtfs-realtime-bindings>=1.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
