name: Admin boundaries refresh (manual)

# BKG VG250 administrative boundaries update roughly annually, no schedule,
# same as orchestrator/definitions.py's admin_boundaries_job, which is
# "manual trigger only" there too. Run this by hand from the Actions tab
# when a new VG250 release comes out.
on:
  workflow_dispatch: {}

concurrency:
  group: motherduck-writer
  cancel-in-progress: false

env:
  DUCKDB_PATH: "md:transit_mesh"
  # GitHub Actions rejects env keys that only differ by case as duplicates,
  # so only one casing can be set here, ingestion/duckdb_utils.py checks
  # both MOTHERDUCK_TOKEN and motherduck_token, so either works.
  MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      - name: Debug context
        run: |
          set -euxo pipefail
          echo "run_id=${{ github.run_id }} attempt=${{ github.run_attempt }} triggered_by=${{ github.event_name }}"
          echo "commit=${{ github.sha }}"
          echo "DUCKDB_PATH=$DUCKDB_PATH"
          uv run python --version
          uv run dbt --version

      - name: Fetch BKG VG250 admin boundaries
        run: |
          set -euxo pipefail
          uv run python -m ingestion.fetch_admin_boundaries

      - name: Enrich stops with admin boundaries
        run: |
          set -euxo pipefail
          uv run python -m ingestion.enrich_stops_with_boundaries

      - name: dbt deps
        run: |
          set -euxo pipefail
          cd dbt_transit && uv run --project .. dbt deps --profiles-dir .

      - name: dbt build
        run: |
          set -euxo pipefail
          cd dbt_transit && uv run --project .. dbt build --profiles-dir .

      - name: dbt build summary
        if: always()
        run: |
          set -euxo pipefail
          echo "## dbt build, admin boundaries refresh" >> "$GITHUB_STEP_SUMMARY"
          if [ -f dbt_transit/target/run_results.json ]; then
            jq -r '.results[] | "- \(.status): \(.unique_id) (\(.execution_time | floor)s)"' \
              dbt_transit/target/run_results.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "(no run_results.json, the run likely failed before dbt build started)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Dump dbt log tail on failure
        if: failure()
        run: |
          echo '--- dbt_transit/logs/dbt.log (last 300 lines) ---'
          tail -n 300 dbt_transit/logs/dbt.log 2>/dev/null || echo "(no dbt.log found)"

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts-admin-boundaries-${{ github.run_id }}
          path: |
            dbt_transit/target/run_results.json
            dbt_transit/target/manifest.json
            dbt_transit/logs/dbt.log
          retention-days: 7
          if-no-files-found: ignore
